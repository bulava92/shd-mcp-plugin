<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHD controller observability</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f9fb;--panel:#edf1f5;--line:rgba(31,41,55,.16);--ink:#20242a;--muted:#69717c;--accent:#4f5967;--soft:rgba(79,89,103,.12);--good:#2f855a;--bad:#b42318;--button:#fff;--shadow:0 10px 26px rgba(31,41,55,.1)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:18px}.card{padding:18px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:var(--shadow)}.eyebrow{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:4px 0 4px;font-size:24px;line-height:1.15}.lede{margin:0;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}.toolbar button,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);color:inherit}.toolbar button{cursor:pointer;font-weight:650}.toolbar .primary{border-color:var(--accent);background:var(--accent);color:var(--button)}.toolbar button:disabled{opacity:.58;cursor:wait}.toolbar select{min-width:150px}.status{min-height:22px;margin:4px 0;color:var(--muted)}.error{color:var(--bad)}.summary{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px}.pill.good{color:var(--good);background:rgba(47,133,90,.14)}.pill.bad{color:var(--bad);background:rgba(180,35,24,.12)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.panel{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.panel h2,.panel h3{margin:0 0 8px;font-size:16px}.panel p{margin:4px 0;color:var(--muted)}.chart{min-height:128px;margin:8px 0;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}.chart svg{display:block;width:100%;height:115px}.chart-empty{display:grid;place-items:center;height:112px;color:var(--muted);font-size:12px}.axis{fill:var(--muted);font-size:10px}.line-a{fill:none;stroke:#4f7cac;stroke-width:2.2}.line-b{fill:none;stroke:#b56a3c;stroke-width:2.2}.table-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:11px;background:var(--bg)}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:12px;z-index:1}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.source-list{display:grid;gap:7px}.source-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--soft)}.setting{display:grid;grid-template-columns:minmax(130px,1fr) minmax(150px,1fr);gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting label{font-weight:650}.setting small{display:block;color:var(--muted);font-weight:400}.setting input,.setting select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:inherit}.setting input:disabled,.setting select:disabled{opacity:.6}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.actions button{border:1px solid var(--accent);border-radius:8px;padding:8px 12px;background:var(--accent);color:var(--button);cursor:pointer}.actions button:disabled{opacity:.6;cursor:wait}@media(max-width:650px){.shell{padding:10px}.card{padding:14px}.setting{grid-template-columns:1fr}.table-wrap{margin:0 -2px}}
    @media(prefers-color-scheme:dark){:root{--bg:#202225;--panel:#2b2e32;--line:#474c52;--ink:#eceff2;--muted:#9da3aa;--accent:#c7b07a;--soft:rgba(199,176,122,.17);--good:#83c995;--bad:#ff9a93;--button:#241f14;--shadow:0 10px 26px rgba(0,0,0,.34)}}
  </style>
</head>
<body>
<main class="shell"><section class="card">
  <div class="eyebrow">SHD MCP · controller observability</div>
  <h1 id="title">Контроллеры</h1><p class="lede" id="lede"></p>
  <div class="toolbar"><button id="refresh" class="primary" type="button">Обновить</button><select id="source" hidden><option value="auto">Автоматически</option><option value="native">Нативный источник</option><option value="influx">Influx/Grafana</option><option value="all">Все источники</option></select><select id="preset" hidden><option value="co2-ventilation">CO₂ → вентиляция</option><option value="temperature-heating">Температура → отопление</option><option value="humidity-ventilation">Влажность → вентиляция</option><option value="custom">Своя пара</option></select></div>
  <div id="status" class="status" role="status" aria-live="polite"></div><div id="summary" class="summary"></div><div id="content"></div>
</section></main>
<script>
(function(){'use strict';
  var T={ru:{history:['История контроллера','Временные точки и происхождение данных.'],compare:['Сравнение рядов','Универсальное сравнение временных рядов на общей шкале.'],settings:['Экспертные настройки','Поля доступны для записи только при явном разрешении источника.'],topology:['Топология контроллеров','Все контроллеры проекта, source inventory и устройства.'],health:['Здоровье telemetry','Состояние нативного источника и Influx/Grafana.'],audit:['Аудит операций','Команды, подтверждения и readback по source-контроллеру.'],refresh:'Обновить',loading:'Загрузка…',empty:'Нет данных для отображения.',records:'записей',native:'Нативный источник',influx:'Influx/Grafana',available:'доступен',unavailable:'недоступен',configured:'настроен',points:'точек',source:'Источник',time:'Время',value:'Значение',name:'Название',controller:'Контроллер',device:'Устройство',room:'Комната',type:'Тип',status:'Статус',error:'Ошибка',readonly:'Только чтение',save:'Сохранить',saved:'Настройки сохранены.',noWritable:'Нет разрешённых writable-параметров.',required:'Обязательное поле',unknown:'Неизвестный формат ответа.',fail:'Не удалось загрузить данные.',id:'ID',action:'Действие',requested:'Запрошено',actual:'Фактически',revision:'Ревизия',checked:'Проверено'},en:{history:['Controller history','Time-series points and data provenance.'],compare:['Series comparison','Universal time-series comparison on one shared scale.'],settings:['Expert settings','Fields are writable only when the source explicitly allows it.'],topology:['Controller topology','All project controllers, source inventory and devices.'],health:['Telemetry health','Native-source and Influx/Grafana status.'],audit:['Operation audit','Commands, confirmations and readback for the source controller.'],refresh:'Refresh',loading:'Loading…',empty:'No data to display.',records:'records',native:'Native source',influx:'Influx/Grafana',available:'available',unavailable:'unavailable',configured:'configured',points:'points',source:'Source',time:'Time',value:'Value',name:'Name',controller:'Controller',device:'Device',room:'Room',type:'Type',status:'Status',error:'Error',readonly:'Read-only',save:'Save',saved:'Settings saved.',noWritable:'No writable parameters are allowed.',required:'Required field',unknown:'Unknown response format.',fail:'Could not load data.',id:'ID',action:'Action',requested:'Requested',actual:'Actual',revision:'Revision',checked:'Checked'}};
  var state={mode:'history',config:{},data:null,busy:false,lang:(String((window.openai&&window.openai.locale)||document.documentElement.lang||'ru').toLowerCase().indexOf('en')===0?'en':'ru')};var pending=new Map(),nextId=1;
  var el={title:document.getElementById('title'),lede:document.getElementById('lede'),refresh:document.getElementById('refresh'),source:document.getElementById('source'),preset:document.getElementById('preset'),status:document.getElementById('status'),summary:document.getElementById('summary'),content:document.getElementById('content')};
  function t(k){return(T[state.lang]&&T[state.lang][k])||k}function obj(x){return x&&typeof x==='object'&&!Array.isArray(x)}function text(x){if(x===null||x===undefined||x==='')return'—';if(typeof x==='object')try{return JSON.stringify(x)}catch(e){return'—'}return String(x)}function esc(x){return text(x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}function unwrap(x){var p=x&&x.structuredContent?x.structuredContent:(x&&x.toolOutput?x.toolOutput:x);if(p&&p.isError)throw Error(t('fail'));return p||{}}
  function merge(a,b){return Object.assign({},a||{},b||{})}function setStatus(v,bad){el.status.textContent=v||'';el.status.className=bad?'status error':'status'}function pill(v,kind){return '<span class="pill '+(kind||'')+'">'+esc(v)+'</span>'}function clear(){el.content.replaceChildren();el.summary.replaceChildren()}
  function rpc(method,params){var o=window.openai;if(method==='tools/call'&&o&&typeof o.callTool==='function')return Promise.resolve(o.callTool(params.name,params.arguments||{}));var id=nextId++;window.parent.postMessage({jsonrpc:'2.0',id:id,method:method,params:params||{}},'*');return new Promise(function(resolve,reject){var timeout=setTimeout(function(){pending.delete(id);reject(Error(t('fail')))},15000);pending.set(id,{resolve:resolve,reject:reject,timeout:timeout})})}
  function metaFrom(p){var m=obj(p.meta)?p.meta:{},w=obj(m.widget)?m.widget:{};state.mode=String(w.mode||m.mode||state.mode||'history');state.config=merge(state.config,w);state.config.sourceArgs=obj(w.sourceArgs)?w.sourceArgs:(obj(m.sourceArgs)?m.sourceArgs:{});return m}
  function dataFrom(p){var source=unwrap(p);metaFrom(source);return source.meta&&source.meta.widget&&source.data!==undefined?source.data:source}
  function labels(){var heading=T[state.lang][state.mode]||T[state.lang].history;el.title.textContent=heading[0];el.lede.textContent=heading[1];el.refresh.textContent=t('refresh');el.source.hidden=!['history','compare','health'].includes(state.mode);el.preset.hidden=state.mode!=='compare';if(state.mode==='compare'&&state.config.preset)el.preset.value=state.config.preset}
  function summary(items){el.summary.replaceChildren();(items||[]).forEach(function(x){var s=document.createElement('span');s.className='pill '+(x.kind||'');s.textContent=x.value;el.summary.append(s)})}
  function chart(points,cls){var nums=(Array.isArray(points)?points:[]).map(function(p){return Number(p&&p.value)}).filter(function(v){return Number.isFinite(v)});if(!nums.length)return '<div class="chart-empty">'+esc(t('empty'))+'</div>';var w=700,h=112,pad=18,min=Math.min.apply(null,nums),max=Math.max.apply(null,nums);if(min===max){min-=1;max+=1}var coords=nums.map(function(v,i){var x=pad+(w-pad*2)*(nums.length===1?.5:i/(nums.length-1));var y=h-pad-(h-pad*2)*(v-min)/(max-min);return x.toFixed(1)+','+y.toFixed(1)}).join(' ');return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(t('value'))+'"><polyline class="'+(cls||'line-a')+'" points="'+coords+'"/><text class="axis" x="4" y="14">'+esc(String(max))+'</text><text class="axis" x="4" y="'+(h-3)+'">'+esc(String(min))+'</text></svg>'}
  function card(title,body){var n=document.createElement('section');n.className='panel';var h=document.createElement('h2');h.textContent=title;n.append(h);if(typeof body==='string')n.insertAdjacentHTML('beforeend',body);else if(body) n.append(body);return n}
  function table(headers,rows){var wrap=document.createElement('div');wrap.className='table-wrap';var tab=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(function(h){var th=document.createElement('th');th.textContent=h;tr.append(th)});thead.append(tr);tab.append(thead);var tb=document.createElement('tbody');(rows||[]).forEach(function(row){var r=document.createElement('tr');row.forEach(function(v){var td=document.createElement('td');td.textContent=text(v);r.append(td)});tb.append(r)});tab.append(tb);wrap.append(tab);return wrap}
  function renderHistory(d){var points=Array.isArray(d.points)?d.points:[];var sources=Array.isArray(d.history_sources)?d.history_sources:[];summary([{value:points.length+' '+t('points')},{value:t('source')+': '+text(d.selected_history_source||'—'),kind:d.selected_history_source?'good':'bad'},{value:t('records')+': '+((d.commands||[]).length)}]);var box=document.createElement('div');box.className='grid';box.append(card(t('source'),'<div class="source-list">'+sources.map(function(s){return '<div class="source-row"><span>'+esc(s.name==='native'?t('native'):t('influx'))+'</span><span>'+pill(s.available?t('available'):t('unavailable'),s.available?'good':'bad')+'</span></div>'}).join('')+'</div>'));var cp=card(t('value'));cp.insertAdjacentHTML('beforeend','<div class="chart">'+chart(points,'line-a')+'</div>');box.append(cp);el.content.append(box);if(points.length)el.content.append(table([t('time'),t('value'),t('name'),t('source')],points.slice(-80).reverse().map(function(p){return[p.time,p.value,p.name||p.topic||p.channel,d.telemetry&&d.telemetry.provider||d.selected_history_source]})));else el.content.append(document.createTextNode(t('empty')))}
  function renderCompare(d){var list=Array.isArray(d.series)?d.series:[];summary([{value:(d.preset||'custom')},{value:list.length+' '+t('records')},{value:text(d.from)+' → '+text(d.to)}]);var grid=document.createElement('div');grid.className='grid';list.forEach(function(s,i){var source=s.selected_history_source||s.history_source||'';var sourceLabel=source==='native'?t('native'):(source==='influx'?t('influx'):text(source||'—'));var p=card(s.label||s.id||t('records'),'<p>'+esc(s.controller||'')+' · '+esc(s.item_id||'')+' '+pill(sourceLabel,source?'':'bad')+' '+pill(s.available?t('available'):text(s.error_code||t('unavailable')),s.available?'good':'bad')+'</p><div class="chart">'+chart(s.points,i%2?'line-b':'line-a')+'</div>');grid.append(p)});el.content.append(grid);if(!list.length)el.content.append(document.createTextNode(t('empty')))}
  function inputFor(s){var wrap=document.createElement('div');wrap.className='setting';var label=document.createElement('label');label.textContent=text(s.name||s.key);if(s.description){var small=document.createElement('small');small.textContent=s.description;label.append(small)}var value=s.current_value;var input;if(Array.isArray(s.enum_values)&&s.enum_values.length){input=document.createElement('select');s.enum_values.forEach(function(v){var o=document.createElement('option');o.value=String(v);o.textContent=String(v);input.append(o)});input.value=value===null||value===undefined?'':String(value)}else if(String(s.value_type||'').toLowerCase()==='boolean'){input=document.createElement('input');input.type='checkbox';input.checked=value===true||value===1||value==='1'}else{input=document.createElement('input');input.type=['number','integer'].includes(String(s.value_type||'').toLowerCase())?'number':'text';if(s.min!==null&&s.min!==undefined)input.min=s.min;if(s.max!==null&&s.max!==undefined)input.max=s.max;if(s.step!==null&&s.step!==undefined)input.step=s.step;input.value=value===null||value===undefined?'':String(value)}input.dataset.key=s.key;input.disabled=!s.writable;wrap.append(label,input);if(!s.writable){var ro=document.createElement('div');ro.className='muted';ro.textContent=t('readonly');wrap.append(ro)}return wrap}
  function renderSettings(d){var settings=Array.isArray(d.settings)?d.settings:[];summary([{value:settings.length+' '+t('records')},{value:t('revision')+': '+text(d.source_revision)}]);var form=document.createElement('div');form.className='panel';settings.forEach(function(s){form.append(inputFor(s))});var actions=document.createElement('div');actions.className='actions';var btn=document.createElement('button');btn.type='button';btn.textContent=t('save');btn.disabled=!settings.some(function(s){return s.writable});btn.onclick=function(){saveSettings(form,settings,d)};actions.append(btn);form.append(actions);if(!settings.some(function(s){return s.writable})){var note=document.createElement('p');note.className='muted';note.textContent=t('noWritable');form.append(note)}el.content.append(form)}
  function saveSettings(form,settings,d){var changes={};settings.forEach(function(s){if(!s.writable)return;var input=form.querySelector('[data-key="'+CSS.escape(String(s.key))+'"]');if(!input)return;var v=input.type==='checkbox'?input.checked:input.value;if(['number','integer'].includes(String(s.value_type||'').toLowerCase())&&v!=='')v=Number(v);changes[s.key]=v});if(!Object.keys(changes).length)return;var a=merge(state.config.sourceArgs,{settings:changes,expected_revision:d.source_revision||'',idempotency_key:'mcp-widget-'+Date.now()});rpc('tools/call',{name:state.config.writeTool||'shd_update_controller_expert_settings',arguments:a}).then(function(){setStatus(t('saved'),false);refresh()}).catch(function(e){setStatus(e.message||t('fail'),true)})}
  function renderTopology(d){var controllers=Array.isArray(d.controllers)?d.controllers:[],items=Array.isArray(d.items)?d.items:[];summary([{value:controllers.length+' '+t('controller')},{value:items.length+' '+t('records')}]);el.content.append(table([t('controller'),t('type'),t('records'),t('revision')],controllers.map(function(c){var role=c.controller_role==='source'?t('source'):t('controller');return[c.controller_name||c.controller,role+' · '+(c.controller_type||'—'),(c.items||[]).length,c.source_revision]})));el.content.append(table([t('name'),t('controller'),t('room'),t('type')],items.slice(0,500).map(function(i){return[i.name||i.id,i.source_controller_id,i.room||i.room_name,i.type||i.devclass]})))}
  function renderHealth(d){var list=Array.isArray(d.controllers)?d.controllers:[d];summary([{value:list.length+' '+t('controller')}]);var grid=document.createElement('div');grid.className='grid';list.forEach(function(c){var sources=Array.isArray(c.sources)?c.sources:[];grid.append(card(c.controller||c.source_controller_id||t('controller'),'<p>'+pill(c.status||'—',c.status==='available'?'good':'')+'</p><div class="source-list">'+sources.map(function(s){return '<div class="source-row"><span>'+esc(s.name==='native'?t('native'):t('influx'))+'</span><span>'+pill(s.available?t('available'):(s.configured?t('configured'):t('unavailable')),s.available?'good':(s.configured?'':'bad'))+'</span></div>'}).join('')+'</div>'))});el.content.append(grid)}
  function renderAudit(d){var rows=Array.isArray(d.audit)?d.audit:(Array.isArray(d.commands)?d.commands:[]);summary([{value:rows.length+' '+t('records')}]);el.content.append(rows.length?table([t('time'),t('device'),t('action'),t('status'),t('requested'),t('actual')],rows.map(function(x){return[x.created_at,x.item_id,x.action,x.status,text(x.requested_value),text(x.actual_readback)]})):document.createTextNode(t('empty')))}
  function render(){clear();labels();var d=state.data||{};try{if(state.mode==='history')renderHistory(d);else if(state.mode==='compare')renderCompare(d);else if(state.mode==='settings')renderSettings(d);else if(state.mode==='topology')renderTopology(d);else if(state.mode==='health')renderHealth(d);else if(state.mode==='audit')renderAudit(d);else el.content.append(document.createTextNode(t('unknown')))}catch(e){setStatus(e.message||t('unknown'),true)}}
  function apply(x){var p=unwrap(x);state.data=dataFrom(p);setStatus('',false);render()}
  function refresh(){if(state.busy)return;var args=merge(state.config.listArgs,state.config.sourceArgs);if(state.mode!=='settings'&&el.source.value&&['history','compare','health'].includes(state.mode))args.source=el.source.value;if(state.mode==='compare'){args.preset=el.preset.value;var groups={"co2-ventilation":["co2","ventilation"],"temperature-heating":["temperature","heating"],"humidity-ventilation":["humidity","ventilation"]}[args.preset];if(groups&&Array.isArray(args.series)){var selected=args.series.filter(function(s){return groups.includes(String(s.group||'').toLowerCase())});if(selected.length)args.series=selected}}var tool=state.config.dataTool;if(!tool){setStatus(t('unknown'),true);return}state.busy=true;el.refresh.disabled=true;setStatus(t('loading'),false);rpc('tools/call',{name:tool,arguments:args}).then(apply).catch(function(e){setStatus(e.message||t('fail'),true)}).finally(function(){state.busy=false;el.refresh.disabled=false})}
  el.source.onchange=refresh;el.preset.onchange=refresh;el.refresh.onclick=refresh;
  window.addEventListener('message',function(ev){if(ev.source!==window.parent)return;var m=ev.data||{};if(m.id!==undefined&&pending.has(m.id)){var q=pending.get(m.id);pending.delete(m.id);clearTimeout(q.timeout);if(m.error)q.reject(Error(m.error.message||t('fail')));else q.resolve(m.result);return}if(m.method==='ui/notifications/tool-input'||m.method==='ui/notifications/tool-result'){try{apply(m.params&&m.params.structuredContent||m.params||{})}catch(e){setStatus(e.message||t('fail'),true)}}});
  rpc('ui/initialize',{protocolVersion:'2025-11-25',appInfo:{name:'SHD controller observability',title:'SHD MCP',version:'1.0.0',websiteUrl:'https://shd.xyz.su'},appCapabilities:{}}).then(function(){window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')}).catch(function(){});var initial=window.openai&&window.openai.toolOutput||window.openai&&window.openai.toolInput;if(initial){try{apply(initial)}catch(e){setStatus(e.message||t('fail'),true)}}else{refresh()}
}());
</script>
</body>
</html>
